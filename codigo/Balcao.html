        " (" + dsp.fora.slice(0, 4).map(function (r) { var x = alunoPorId[r[2]]; return x ? x.nome + ", " + x.turma : r[2]; }).join("; ") + (dsp.fora.length > 4 ? "…" : "") + ").");
      if (avisos.length) confirmar("Atenção", avisos.join(" ") + " Quer emprestar «" + livro + "» mesmo assim?", "Emprestar mesmo assim", true, gravar);

  // ---------------- Gerir alunos ----------------
  function janelaAluno(a) {

      '<div class="linha-campos"><label class="campo"><span class="label-xs">N.º de processo</span><input id="aProc" inputmode="numeric" maxlength="8" value="' + esc(a ? a.id : "") + '"' + (a ? ' disabled' : '') + '></label>' +
      '<label class="campo"><span class="label-xs">Turma</span><select id="aTurma">' + turmas + '</select></label>' +

    $(a ? "aNome" : "aNome").focus();
    $("aOk").addEventListener("click", function () {

      if (o.nome.length < 3) { toast("Escreva o nome do aluno.", true); $("aNome").focus(); return; }
      if (!a && !/^\d{3,8}$/.test(o.id)) { toast("Escreva o número de processo (só algarismos).", true); $("aProc").focus(); return; }
      ocupar($("aOk"), api("guardarAluno", o).then(function (l) {
        D.alunos = D.alunos.filter(function (x) { return x[0] !== l[0]; }); D.alunos.push(l); indexar();
        S.turma = l[2]; if (a) S.aluno = l[0];
        fecharJanela(); desenhar(); toast(a ? "Dados do aluno guardados." : l[1] + " acrescentado à turma " + l[2] + ".");
      }));
    });
    if (a) $("aSaiu").addEventListener("click", function () {
      var b = $("aSaiu");
      if (b.getAttribute("data-conf") !== "1") { b.setAttribute("data-conf", "1"); b.textContent = "Confirmar: saiu da escola"; return; }
      ocupar(b, api("retirarAluno", a.id).then(function () {
        D.alunos = D.alunos.filter(function (x) { return x[0] !== a.id; }); indexar();
        S.grupo = S.grupo.filter(function (x) { return x !== a.id; }); S.aluno = null;
        fecharJanela(); desenhar(); toast(a.nome + " deixou de aparecer nas listas.");
      }));
    });
  }

  function cartaoReq(r) {
    var s = situacao(r);
    var h = '<div class="req ' + s.tipo + '"><div class="titulo">' + esc(titulo(r)) + (r[6] ? ' <span class="pill pill-prorr">prorrogado' + (r[6] > 1 ? ' ×' + r[6] : '') + '</span>' : '') + '</div>' +
      '<div class="sit">' + esc(s.txt) + '</div>' +
      '<div class="datas"><span>Requisitado: ' + fmt(r[4]) + '</span><span>Entrega: ' + fmt(r[5]) + '</span>' +
      (r[6] ? '<span>Limite (' + plural(r[6], "prorrogação", "prorrogações") + '): ' + fmt(r[7]) + '</span>' : '<span>Com prorrogação: ' + fmt(somaIso(r[5], D.diasProrrogacao)) + '</span>') +
      (r[8] ? '<span>Devolvido: ' + fmt(r[8]) + '</span>' : '') + '</div>';
    if (r[8]) {
      h += '<div class="acts"><button class="btn-lig" type="button" data-andev="' + esc(r[0]) + '">Anular devolução (engano)</button></div>';
    }

      h += '<div class="acts">' + ((r[6] || 0) < D.maxProrrogacoes ? '<button class="btn btn-sm" type="button" data-prorr="' + esc(r[0]) + '">' + (r[6] ? (r[6] + 1) + '.ª prorrogação' : 'Prorrogar') + ' +' + D.diasProrrogacao + ' dias</button>' : '') +
        '<button class="btn btn-sm btn-pri" type="button" data-dev="' + esc(r[0]) + '">Registar devolução</button>' +
        (r[0].indexOf("REQ-" + D.hoje.slice(2).replace(/-/g, "")) === 0 ? '<button class="btn-lig" type="button" data-anreq="' + esc(r[0]) + '">Anular (engano)</button>' : '') + '</div>';
    }
    return h + '</div>';
  }
  function substituirReq(r) {
    for (var i = 0; i < D.requisicoes.length; i++) if (D.requisicoes[i][0] === r[0]) D.requisicoes[i] = r;
    reqPorId[r[0]] = r;
  }
  function ligarAcoesReq() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-andev]"), function (b) {

          ocupar(btn, api("anularDevolucao", r[0]).then(function (n) { substituirReq(n); fecharJanela(); atualizarContador(); desenhar(); toast("Devolução anulada."); }));
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-anreq]"), function (b) {
      b.addEventListener("click", function () {
        var r = reqPorId[b.getAttribute("data-anreq")];

          ocupar(btn, api("anularRequisicao", r[0]).then(function () {
            D.requisicoes = D.requisicoes.filter(function (x) { return x[0] !== r[0]; }); delete reqPorId[r[0]];
            fecharJanela(); atualizarContador(); desenhar(); toast("Requisição anulada.");

        });

    Array.prototype.forEach.call(document.querySelectorAll("[data-prorr]"), function (b) {
      b.addEventListener("click", function () {
        var r = reqPorId[b.getAttribute("data-prorr")];
        confirmar("Prorrogar requisição", "Prorrogar «" + titulo(r) + "» até " + fmt(somaIso(r[6] ? (r[7] || r[5]) : r[5], D.diasProrrogacao)) + "? É a " + ((r[6] || 0) + 1) + ".ª de " + D.maxProrrogacoes + " prorrogações possíveis.", "Prorrogar", false, function (btn) {
          ocupar(btn, api("prorrogarRequisicao", r[0]).then(function (n) { substituirReq(n); fecharJanela(); atualizarContador(); desenhar(); toast("Prorrogado até " + fmt(n[7]) + "."); }));
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-dev]"), function (b) {
      b.addEventListener("click", function () {
        var r = reqPorId[b.getAttribute("data-dev")];
        var minDev = r[4] > D.inicioAno ? r[4] : D.inicioAno;
        abrirJanela('<h2>Registar devolução</h2><p>«' + esc(titulo(r)) + '»</p>' +
          '<label class="campo"><span class="label-xs">Data da devolução</span><input type="date" id="dDev" value="' + D.hoje + '" min="' + minDev + '" max="' + D.hoje + '"></label>' +
          '<p class="nota">Se o livro foi devolvido noutro dia, mude a data.</p>' +
          '<div class="fim"><button class="btn" type="button" data-fechar>Cancelar</button><button class="btn btn-pri" type="button" id="cOk">Registar devolução</button></div>');
        $("cOk").addEventListener("click", function () {
          var d = $("dDev").value || D.hoje;
          if (d < r[4]) { toast("A devolução não pode ser antes da requisição (" + fmt(r[4]) + ").", true); return; }
          ocupar($("cOk"), api("registarDevolucao", r[0], d).then(function (n) { substituirReq(n); fecharJanela(); atualizarContador(); desenhar(); toast("Devolução registada (" + fmt(n[8]) + ")."); }));
        });
      });
    });
  }

  // ---------------- Módulo 2: Atividade ----------------
  // Data das entradas: hoje, ou um dia anterior para lançar registos antigos.
  function dataAtiv() { return S.dataAtiv && S.dataAtiv < D.hoje ? S.dataAtiv : D.hoje; }
  function barraDataAtiv() {
    var d = dataAtiv(), passado = d !== D.hoje;
    return '<div class="aviso-data' + (passado ? ' passado' : '') + '"><label for="aData">Data da entrada</label><input type="date" id="aData" value="' + d + '" min="' + D.inicioAno + '" max="' + D.hoje + '">' +
      (passado ? '<label for="aHora">Hora (opcional)</label><input type="time" id="aHora" value="' + esc(S.horaAtiv) + '"><span>A registar entradas de ' + esc(nomeDia(d)) + '</span><button class="btn btn-sm" type="button" id="aHoje">Voltar a hoje</button>'
        : '<span class="nota">Para lançar entradas de dias anteriores, mude a data.</span>') + '</div>';

  function ligarDataAtiv() {
    if (!$("aData")) return;
    $("aData").addEventListener("change", function () { S.dataAtiv = this.value || null; desenhar(true); });
    if ($("aHora")) $("aHora").addEventListener("change", function () { S.horaAtiv = this.value; });
    if ($("aHoje")) $("aHoje").addEventListener("click", function () { S.dataAtiv = null; S.horaAtiv = ""; desenhar(true); });

  function grupoCard() {
    if (!S.multi) return "";
    S.grupo = S.grupo.filter(function (id) { return !!alunoPorId[id]; });
    return '<div class="card"><div class="card-cab"><h2>Grupo</h2><span class="label-xs">' + plural(S.grupo.length, "aluno", "alunos") + '</span></div>' +
      (S.grupo.length ? '<div class="grupo-lista">' + S.grupo.map(function (id) { var a = alunoPorId[id];
        return '<span class="chip">' + esc(a.nome) + ' · ' + esc(a.turma) + '<button type="button" data-tirar="' + esc(id) + '" aria-label="Tirar ' + esc(a.nome) + '">×</button></span>'; }).join("") + '</div>'
        : '<p class="vazio">Toque nos alunos para os juntar ao grupo. Pode ir a várias turmas.</p>') +

  }
  function ligarGrupo() {
    var bm = $("btnMulti");
    if (bm) bm.addEventListener("click", function () { S.multi = !S.multi; if (!S.multi) S.grupo = []; S.aluno = null; desenhar(true); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-tirar]"), function (b) {
      b.addEventListener("click", function () { var id = b.getAttribute("data-tirar"); S.grupo = S.grupo.filter(function (x) { return x !== id; }); desenhar(true); });
    });
    if ($("btnGrupo")) $("btnGrupo").addEventListener("click", janelaGrupo);
  }
  function janelaGrupo() {
    if (!S.grupo.length) return;
    abrirJanela('<h2>O que vêm fazer?</h2><p>' + plural(S.grupo.length, "aluno", "alunos") + ': ' + esc(S.grupo.map(function (id) { return alunoPorId[id].nome.split(" ")[0]; }).join(", ")) + '</p>' +
      '<div class="atividades">' + D.atividades.filter(function (at) { return at !== "Usar computadores"; }).map(function (at) {
        return '<button type="button" class="ativ-btn" data-gativ="' + esc(at) + '"><span class="ic">' + svg(ICONES[at] || '<circle cx="12" cy="12" r="4"/>') + '</span>' + esc(at) + '</button>'; }).join("") + '</div>' +
      '<p class="nota">Os computadores registam-se um aluno de cada vez, para escolher o número.</p>' +
      '<div class="fim"><button class="btn" type="button" data-fechar>Cancelar</button></div>');
    Array.prototype.forEach.call(document.querySelectorAll("[data-gativ]"), function (b) {
      b.addEventListener("click", function () {
        if (S.ocupado) return;
        var at = b.getAttribute("data-gativ"), n = S.grupo.length;
        S.ocupado = true;
        Array.prototype.forEach.call(document.querySelectorAll("#janela button"), function (x) { x.disabled = true; });
        api("registarPresencas", { leitores: S.grupo.slice(), atividade: at, data: dataAtiv() !== D.hoje ? dataAtiv() : "", hora: dataAtiv() !== D.hoje ? S.horaAtiv : "" }).then(function (l) {
          l.forEach(function (p) { if (!p[7] || p[7] === D.hoje) D.presencasHoje.push(p); });
          S.grupo = []; S.multi = false; S.aluno = null; S.turma = null; fecharJanela(); desenhar();
          toast(plural(n, "entrada registada", "entradas registadas") + " — " + at + ".");
        }).catch(function (e) { toast(e.message, true); fecharJanela(); }).then(function () { S.ocupado = false; });
      });
    });
  }
  function desenharAtividade() {
    var v = $("vista"), hoje = '<div class="lado">' + grupoCard() + pcsCard() + hojeCard() + '</div>';
    var btnMulti = '<button class="btn btn-sm' + (S.multi ? ' btn-pri' : '') + '" type="button" id="btnMulti">' + (S.multi ? 'Modo grupo ligado — desligar' : 'Registar vários alunos') + '</button>';
    if (!S.turma) {
      v.innerHTML = migalhas("Turmas") + barraDataAtiv() + '<div class="ficha"><div class="card"><div class="card-cab"><h2>Entrada na biblioteca</h2><span class="cab-acoes"><span class="nota">Escolha a turma</span>' + btnMulti + '</span></div>' + grelhaTurmas(false) + '</div>' + hoje + '</div>';
      ligarMigalhas(); ligarTurmas(); ligarGrupo(); ligarDataAtiv(); return;
    }
    if (!S.aluno || S.multi) {
      v.innerHTML = migalhas("Turmas") + barraDataAtiv() + '<div class="ficha"><div class="card"><div class="card-cab"><h2>Turma ' + esc(S.turma) + '</h2><span class="cab-acoes"><span class="nota">' + (S.multi ? 'Toque nos alunos do grupo' : 'Escolha o aluno') + '</span>' + btnMulti + '</span></div>' + listaAlunos(false) + '</div>' + hoje + '</div>';
      ligarMigalhas(); ligarGrupo(); ligarDataAtiv();
      ligarAlunos(function (id) {
        if (!S.multi) { S.aluno = id; desenhar(); return; }
        var k = S.grupo.indexOf(id); if (k >= 0) S.grupo.splice(k, 1); else S.grupo.push(id);
        desenhar(true);
      });
      return;
    }
    var a = alunoPorId[S.aluno];
    var h = '<div class="card"><div class="card-cab"><h2>O que vem fazer ' + esc(a.nome.split(" ")[0]) + '?</h2><span class="nota">' + esc(a.nome) + ' · ' + esc(a.turma) + '</span></div><div class="atividades">' +
      D.atividades.map(function (at) { return '<button type="button" class="ativ-btn" data-ativ="' + esc(at) + '"><span class="ic">' + svg(ICONES[at] || '<circle cx="12" cy="12" r="4"/>') + '</span>' + esc(at) + '</button>'; }).join("") + '</div></div>';
    v.innerHTML = migalhas("Turmas") + barraDataAtiv() + '<div class="ficha">' + h + hoje + '</div>';
    ligarMigalhas(); ligarDataAtiv();
    Array.prototype.forEach.call(document.querySelectorAll("[data-ativ]"), function (b) {
      b.addEventListener("click", function () {
        if (S.ocupado) return;
        var at = b.getAttribute("data-ativ");
        if (at === "Usar computadores") { janelaComputador(a, at); return; }
        ocupar(b, registarEntrada(a, at, ""));
      });
    });
  }
  // Presença: [hora, turma, leitor, atividade, computador, id, horaSaida]
  function pcsEmUso() {
    var m = {};
    D.presencasHoje.forEach(function (p) { if (p[4] && !p[6]) m[p[4]] = p; });
    return m;
  }
  function registarEntrada(a, at, pc) {
    var d = dataAtiv(), passado = d !== D.hoje;
    return api("registarPresenca", { leitor: a.id, atividade: at, computador: pc, data: passado ? d : "", hora: passado ? S.horaAtiv : "" }).then(function (p) {
      if (!passado) {
        if (p[4]) D.presencasHoje.forEach(function (x) { if (x[4] === p[4] && !x[6]) x[6] = p[0]; });
        D.presencasHoje.push(p);
      }
      fecharJanela();
      toast(a.nome + " — " + at + (p[4] ? " · PC " + p[4] : "") + (passado ? " (registado em " + fmt(d) + ")" : " (" + p[0] + ")")); S.aluno = null; desenhar();
    });
  }
  function janelaComputador(a, at) {
    var passadoPc = dataAtiv() !== D.hoje, uso = passadoPc ? {} : pcsEmUso(), n = D.numComputadores || 15, h = "";

      h += '<button type="button" class="pc-btn' + (u ? ' recente' : '') + '" data-pc="' + i + '"><b>' + i + '</b><span>' +
        (u ? esc(quem ? quem.nome.split(" ")[0] : "em uso") + ' · ' + esc(u[0]) : 'livre') + '</span></button>';
    }
    abrirJanela('<h2>Que computador?</h2><p>' + esc(a.nome) + ' · ' + esc(a.turma) + '</p>' +
      '<div class="pcs">' + h + '</div>' + (passadoPc ? '<p class="nota">Entrada de ' + esc(fmt(dataAtiv())) + ': se não souber o número do computador, carregue em «Sem número».</p><div><button class="btn btn-sm" type="button" id="pcSem">Sem número</button></div>'
        : '<p class="nota">A amarelo: computadores em uso (nome do aluno e hora de entrada).</p>') +

    function gravar(pc, b) {

          '<p>Se esse aluno já saiu, pode libertar o computador e atribuí-lo a ' + esc(a.nome) + '.</p>' +

        $("pcVoltar").addEventListener("click", function () { janelaComputador(a, at); });

  function pcsCard() {

  function hojeCard() {

  // Botões "Anular" e "Libertar" (a lista é redesenhada muitas vezes, por isso ouvem-se na secção inteira)
  $("vista").addEventListener("click", function (ev) {

  // ---------------- Material e jogos ----------------
  // D.material: [id, nome, tipo, estado] · D.materialFora: [idEmprestimo, turma, leitor, idMaterial, "dd/MM HH:mm"]
  function matPorId(id) { return D.material.filter(function (m) { return m[0] === id; })[0]; }
  function nomeMat(m) { return m ? (m[2] + (m[1] ? " " + m[1] : "")) : "Material"; }
  function matForaCard() {
    var l = D.materialFora;
    return '<div class="card"><div class="card-cab"><h2>Emprestado agora</h2><span class="label-xs">' + plural(l.length, "artigo", "artigos") + '</span></div>' +
      (l.length ? '<div class="pcs-uso">' + l.map(function (e) {
        var a = alunoPorId[e[2]], m = matPorId(e[3]);
        return '<div style="grid-template-columns:minmax(0,1fr) auto"><span><b>' + esc(nomeMat(m) || e[3]) + '</b> · ' + esc(a ? a.nome : e[2]) + ' <span class="nota">· ' + esc(a ? a.turma : e[1]) + ' · desde ' + esc(e[4]) + '</span></span>' +
          '<button class="btn btn-sm" type="button" data-devmat="' + esc(e[0]) + '">Devolver</button></div>';
      }).join("") + '</div>' : '<p class="vazio">Não há material emprestado.</p>') + '</div>';
  }
  function desenharMaterial() {
    var v = $("vista"), lado = '<div class="lado">' + matForaCard() + '</div>';
    if (!D.material.length) {
      v.innerHTML = '<div class="card"><h2>Material e jogos</h2><p class="vazio">A folha «Material» está vazia. Escreva lá uma linha por artigo (código, nome ou número, tipo, estado) e carregue em Atualizar.</p></div>';
      return;
    }
    if (!S.turma) {
      v.innerHTML = migalhas("Turmas") + '<div class="ficha"><div class="card"><div class="card-cab"><h2>Emprestar material ou jogos</h2><span class="nota">Escolha a turma</span></div>' + grelhaTurmas(false) + '</div>' + lado + '</div>';
      ligarMigalhas(); ligarTurmas(); ligarMaterial(); return;
    }
    if (!S.aluno) {
      v.innerHTML = migalhas("Turmas") + '<div class="ficha"><div class="card"><div class="card-cab"><h2>Turma ' + esc(S.turma) + '</h2><span class="nota">Escolha o aluno</span></div>' + listaAlunos(false) + '</div>' + lado + '</div>';
      ligarMigalhas(); ligarAlunos(function (id) { S.aluno = id; desenhar(); }); ligarMaterial(); return;
    }
    var a = alunoPorId[S.aluno], foraIds = {}, tipos = {}, ordem = [];
    D.materialFora.forEach(function (e) { foraIds[e[3]] = alunoPorId[e[2]] ? alunoPorId[e[2]].nome.split(" ")[0] : "emprestado"; });
    D.material.forEach(function (m) { if (!tipos[m[2]]) { tipos[m[2]] = []; ordem.push(m[2]); } tipos[m[2]].push(m); });
    var h = '<div class="card"><div class="card-cab"><h2>O que leva ' + esc(a.nome.split(" ")[0]) + '?</h2><span class="nota">' + esc(a.nome) + ' · ' + esc(a.turma) + '</span></div>';
    ordem.sort(ordNome).forEach(function (t) {
      h += '<h3>' + esc(t) + '</h3><div class="mat-grupo">' + tipos[t].sort(function (x, y) { return x[1].localeCompare(y[1], "pt", { numeric: true }); }).map(function (m) {
        var avariado = /avariad|danificad/i.test(m[3]), com = foraIds[m[0]];
        return '<button type="button" class="mat-btn" data-mat="' + esc(m[0]) + '"' + (avariado || com ? ' disabled' : '') + '>' + esc(m[1] || m[0]) +
          '<span>' + (avariado ? 'avariado' : (com ? 'com ' + esc(com) : 'disponível')) + '</span></button>';
      }).join("") + '</div>';
    });
    v.innerHTML = migalhas("Turmas") + '<div class="ficha">' + h + '</div>' + lado + '</div>';
    ligarMigalhas(); ligarMaterial();
    Array.prototype.forEach.call(document.querySelectorAll("[data-mat]"), function (b) {
      b.addEventListener("click", function () {
        if (S.ocupado) return;
        var m = matPorId(b.getAttribute("data-mat"));
        ocupar(b, api("emprestarMaterial", { leitor: a.id, material: m[0] }).then(function (e) {
          D.materialFora.push(e); m[3] = "Emprestado"; S.aluno = null; desenhar(); toast(nomeMat(m) + " emprestado a " + a.nome + ".");
        }));
      });
    });
  }
  function ligarMaterial() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-devmat]"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-devmat"), e = D.materialFora.filter(function (x) { return x[0] === id; })[0]; if (!e) return;
        var a = alunoPorId[e[2]], m = matPorId(e[3]);
        abrirJanela('<h2>Devolver ' + esc(nomeMat(m)) + '</h2><p>Emprestado a <b>' + esc(a ? a.nome : e[2]) + '</b> desde ' + esc(e[4]) + '.</p>' +
          '<label class="campo"><span class="label-xs">Se veio com problema, escreva qual</span><textarea id="mObs" maxlength="300" placeholder="Só é preciso se houver problema"></textarea></label>' +
          '<div class="fim"><button class="btn" type="button" data-fechar>Cancelar</button><button class="btn btn-crit" type="button" id="mMau">Devolvido com problema</button><button class="btn btn-pri" type="button" id="mBom">Devolvido em bom estado</button></div>');
        function devolver(btn, problema) {
          var obs = $("mObs").value.trim();
          if (problema && !obs) { toast("Escreva qual é o problema.", true); $("mObs").focus(); return; }
          ocupar(btn, api("devolverMaterial", id, { problema: problema, obs: obs }).then(function (r) {
            D.materialFora = D.materialFora.filter(function (x) { return x[0] !== id; });
            if (m) m[3] = r[1];
            fecharJanela(); desenhar(true); toast(problema ? "Devolvido e marcado como avariado." : "Material devolvido.");
          }));
        }
        $("mBom").addEventListener("click", function () { devolver($("mBom"), false); });
        $("mMau").addEventListener("click", function () { devolver($("mMau"), true); });
      });
    });
  }

  // ---------------- Módulo 3: Espaço ----------------
  function carregarReservas() {
    return api("getReservasSemana", S.semana).then(function (l) { S.reservas = l; if (S.mod === "esp") desenharEspaco(true); })
      .catch(function (e) { toast(e.message, true); });
  }
  function desenharEspaco(jaCarregado) {
    var v = $("vista"), dias = [0, 1, 2, 3, 4].map(function (i) { return somaIso(S.semana, i); });
    var nomesDias = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"];
    var espSel = D.espacos.length > 1 ? '<label class="campo"><span class="label-xs">Espaço</span><select id="fEsp">' + D.espacos.map(function (e) { return '<option value="' + esc(e[0]) + '"' + (e[0] === S.espaco ? ' selected' : '') + '>' + esc(e[1]) + '</option>'; }).join("") + '</select></label>' : '';
    var h = '<div class="card"><div class="semana-ctl"><span class="titulo-sem">Semana de ' + fmt(dias[0]) + ' a ' + fmt(dias[4]) + '</span>' + espSel +
      '<button class="btn" type="button" id="semAnt">‹ Anterior</button><button class="btn" type="button" id="semHoje">Esta semana</button><button class="btn" type="button" id="semSeg">Seguinte ›</button></div>' +
      '<p class="nota">Horário da biblioteca: 8h15 às 18h00. Toque num tempo livre para o reservar; toque numa reserva para ver ou cancelar. Nos dias que já passaram, «Registar» serve para lançar usos antigos do espaço.</p>' +
      '<div class="tabela-wrap"><table class="grelha"><colgroup><col class="ct"><col><col><col><col><col></colgroup><thead><tr><th></th>' +
      dias.map(function (d, i) { return '<th class="' + (d === D.hoje ? 'hoje' : '') + '">' + nomesDias[i] + '<br><span class="num">' + fmtCurto(d) + '</span></th>'; }).join("") + '</tr></thead><tbody>';
    D.tempos.forEach(function (t) {
      h += '<tr><td class="t"><b>' + esc(t[1]) + '</b>' + esc(t[2]) + '–' + esc(t[3]) + '</td>';
      dias.forEach(function (d) {
        var res = S.reservas.filter(function (r) { return r[1] === d && r[2] === t[0] && (!S.espaco || r[3] === S.espaco || !r[3]); })[0];
        var passado = d < D.hoje;
        if (res) {
          var p = profPorId[res[4]];
          h += '<td><button type="button" class="cel ocupada' + (passado ? ' passado' : '') + '" data-res="' + esc(res[0]) + '"><b>' + esc(p ? p.nome : res[4]) + (res[5] ? ' · ' + esc(res[5]) : '') + '</b><span>' + esc(res[6]) + '</span></button></td>';
        } else {
          var antes = d < D.inicioAno;
          h += '<td><button type="button" class="cel' + (passado ? ' passado-livre' : '') + '"' + (antes ? ' disabled' : '') + ' data-livre="' + d + '|' + esc(t[0]) + '">' + (antes ? '' : passado ? 'Registar' : 'Livre') + '</button></td>';
        }
      });
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';
    v.innerHTML = h;
    $("semAnt").addEventListener("click", function () { S.semana = somaIso(S.semana, -7); S.reservas = []; desenharEspaco(); });
    $("semSeg").addEventListener("click", function () { S.semana = somaIso(S.semana, 7); S.reservas = []; desenharEspaco(); });
    $("semHoje").addEventListener("click", function () { S.semana = segundaDe(D.hoje); S.reservas = []; desenharEspaco(); });
    if ($("fEsp")) $("fEsp").addEventListener("change", function () { S.espaco = this.value; desenharEspaco(true); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-livre]"), function (b) {
      b.addEventListener("click", function () { var x = b.getAttribute("data-livre").split("|"); janelaReserva(x[0], x[1]); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-res]"), function (b) {
      b.addEventListener("click", function () { janelaVerReserva(b.getAttribute("data-res")); });
    });
    if (!jaCarregado) carregarReservas();
  }
  function nomeTempo(id) { var t = D.tempos.filter(function (x) { return x[0] === id; })[0]; return t ? t[1] + " (" + t[2] + "–" + t[3] + ")" : id; }
  function nomeDia(iso) { return ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"][diaSemana(iso)] + ", " + fmt(iso); }
  function janelaReserva(data, tempo) {
    var profs = D.professores.map(function (p) { return '<option value="' + esc(p[0]) + '">' + esc(p[1]) + '</option>'; }).join("");
    var turmas = D.turmas.slice().sort(ordTurma).map(function (t) { return '<option>' + esc(t) + '</option>'; }).join("");
    abrirJanela('<h2>' + (data < D.hoje ? 'Registar uso passado do espaço' : 'Reservar o espaço') + '</h2><p><b>' + esc(nomeDia(data)) + '</b> · ' + esc(nomeTempo(tempo)) + '</p>' +
      '<label class="campo"><span class="label-xs">Professor</span><select id="rProf"><option value="">— escolha —</option>' + profs + '</select></label>' +
      '<label class="campo"><span class="label-xs">Turma (opcional)</span><select id="rTurma"><option value="">—</option>' + turmas + '</select></label>' +
      '<label class="campo"><span class="label-xs">O que vão fazer / tipo de atividade</span><textarea id="rFin" maxlength="500"></textarea></label>' +
      '<label class="campo"><span class="label-xs">Repetir</span><select id="rRep"><option value="1">Só neste dia</option><option value="4">Todas as semanas, durante 4 semanas</option><option value="8">Todas as semanas, durante 8 semanas</option><option value="12">Todas as semanas, durante 12 semanas</option><option value="20">Todas as semanas, durante 20 semanas</option><option value="36">Todas as semanas, durante 36 semanas (ano letivo)</option></select></label>' +
      '<div class="fim"><button class="btn" type="button" data-fechar>Cancelar</button><button class="btn btn-pri" type="button" id="rOk">Reservar</button></div>');
    $("rProf").focus();
    $("rOk").addEventListener("click", function () {
      var o = { data: data, tempo: tempo, espaco: S.espaco || "", professor: $("rProf").value, turma: $("rTurma").value, finalidade: $("rFin").value.trim(), semanas: $("rRep").value };
      if (!o.professor) { toast("Escolha o professor.", true); return; }
      if (!o.finalidade) { toast("Escreva o que vão fazer.", true); $("rFin").focus(); return; }
      ocupar($("rOk"), api("criarReserva", o).then(function (res) {
        var fimSem = somaIso(S.semana, 6);
        res.criadas.forEach(function (r) { if (r[1] >= S.semana && r[1] <= fimSem) S.reservas.push(r); });
        fecharJanela(); desenharEspaco(true);
        var msg = res.criadas.length === 1 ? "Reserva registada." : res.criadas.length + " reservas registadas (uma por semana).";
        if (res.ocupadas.length) msg += " Já estava ocupado em: " + res.ocupadas.map(fmtCurto).join(", ") + ".";
        toast(msg, res.ocupadas.length > 0);
      })
        .catch(function (e) { carregarReservas(); throw e; }));
    });
  }
  function janelaVerReserva(id) {
    var r = S.reservas.filter(function (x) { return x[0] === id; })[0]; if (!r) return;
    var p = profPorId[r[4]];
    abrirJanela('<h2>Reserva</h2><p><b>' + esc(nomeDia(r[1])) + '</b> · ' + esc(nomeTempo(r[2])) + '</p>' +
      '<p><span class="label-xs">Professor</span><br>' + esc(p ? p.nome : r[4]) + (r[5] ? ' · turma ' + esc(r[5]) : '') + '</p>' +
      '<p><span class="label-xs">Atividade</span><br>' + esc(r[6]) + '</p>' +
      (r[7] ? '<p class="nota">Esta reserva repete-se todas as semanas.</p>' : '') +
      '<label class="campo"><span class="label-xs">Para cancelar: quem está a cancelar?</span><input id="rQuem" maxlength="80" placeholder="Nome de quem cancela"></label>' +
      '<div class="fim"><button class="btn" type="button" data-fechar>Fechar</button>' +
      (r[7] ? '<button class="btn btn-crit" type="button" id="rDelSeg">Cancelar esta e as seguintes</button>' : '') +
      '<button class="btn btn-crit" type="button" id="rDel">' + (r[7] ? 'Cancelar só esta' : 'Cancelar reserva') + '</button></div>');
    function cancelar(b, seguintes) {
      var quem = $("rQuem").value.trim();
      if (!quem) { toast("Escreva o nome de quem está a cancelar.", true); $("rQuem").focus(); return; }
      ocupar(b, api("apagarReserva", id, quem, seguintes).then(function (ids) {
        S.reservas = S.reservas.filter(function (x) { return ids.indexOf(x[0]) < 0; }); fecharJanela(); desenharEspaco(true);
        toast(ids.length > 1 ? ids.length + " reservas canceladas." : "Reserva cancelada.");
      }));
    }
    $("rDel").addEventListener("click", function () { cancelar($("rDel"), false); });
    if ($("rDelSeg")) $("rDelSeg").addEventListener("click", function () { cancelar($("rDelSeg"), true); });
  }

  // ---------------- Em atraso ----------------
  function desenharAtrasos() {
    var l = listaAtrasos(), v = $("vista");
    if (!l.length) { v.innerHTML = '<div class="card"><h2>Livros em atraso</h2><p class="vazio">Não há livros em atraso. 👍</p></div>'; return; }
    var grupos = {};
    l.forEach(function (r) { var a = alunoPorId[r[2]], t = a ? a.turma : r[1]; (grupos[t] = grupos[t] || []).push(r); });
    var h = '<div class="card"><div class="card-cab"><h2>Livros em atraso</h2><span class="label-xs">' + plural(l.length, "livro", "livros") + ' · toque numa linha para abrir o aluno</span></div><div style="overflow-x:auto"><table class="tab"><thead><tr><th class="n">N.º</th><th>Aluno</th><th>Livro</th><th>Devia entregar</th><th class="n">Dias</th><th>Estado</th></tr></thead><tbody>';
    Object.keys(grupos).sort(ordTurma).forEach(function (t) {
      var it = grupos[t].sort(function (x, y) { return situacao(y).atraso - situacao(x).atraso; });
      h += '<tr class="sub"><td colspan="4">Turma ' + esc(t) + '</td><td colspan="2" class="n">' + plural(it.length, "livro", "livros") + '</td></tr>';
      it.forEach(function (r) {
        var a = alunoPorId[r[2]], s = situacao(r);
        h += '<tr class="clic" data-abrir="' + esc(r[2]) + '"><td class="n">' + esc(a ? a.num : "") + '</td><td><strong>' + esc(a ? a.nome : r[2]) + '</strong></td><td>' + esc(titulo(r)) +
          (r[6] ? ' <span class="pill pill-prorr">prorrogado</span>' : '') + '</td><td class="num">' + fmt(r[7] || r[5]) + '</td><td class="n"><strong>' + s.atraso + '</strong></td><td>' +
          (s.atraso > 30 ? '<span class="pill pill-falta">Mais de 30 dias</span>' : '<span class="pill" style="background:var(--crit-soft);color:var(--crit)">Atrasado</span>') + '</td></tr>';
      });
    });
    v.innerHTML = h + '</tbody></table></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll("[data-abrir]"), function (tr) {
      tr.addEventListener("click", function () {

  // ---------------- Janela, confirmação e botões ocupados ----------------
  function abrirJanela(html) {
    $("janela").innerHTML = html; $("veu").hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll("[data-fechar]"), function (b) { b.addEventListener("click", fecharJanela); });
  }
  function fecharJanela() { $("veu").hidden = true; $("janela").innerHTML = ""; }
  $("veu").addEventListener("click", function (ev) { if (ev.target === $("veu")) fecharJanela(); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !$("veu").hidden) fecharJanela(); });
  function confirmar(titulo, texto, rotulo, perigo, acao) {
    abrirJanela('<h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p><div class="fim"><button class="btn" type="button" data-fechar>Cancelar</button><button class="btn ' + (perigo ? 'btn-crit' : 'btn-pri') + '" type="button" id="cOk">' + esc(rotulo) + '</button></div>');
    $("cOk").addEventListener("click", function () { acao($("cOk")); });
  }
  function ocupar(btn, promessa) {
    S.ocupado = true; var txt = btn.innerHTML; btn.disabled = true;
    if (btn.classList.contains("btn")) btn.textContent = "A gravar…";
    return promessa.catch(function (e) { toast(e.message, true); }).then(function () { S.ocupado = false; if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = txt; } });
  }

  // ---------------- Pesquisa ----------------
  function semAcentos(t) { return String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
  function fecharPesquisa() { $("pesqRes").hidden = true; $("pesqRes").innerHTML = ""; }
  function pesquisar() {
    var q = semAcentos($("pesq").value.trim()), res = $("pesqRes");
    if (!D || q.length < 2) { fecharPesquisa(); return; }
    var palavras = q.split(/\s+/), bate = function (t) { var x = semAcentos(t); return palavras.every(function (p) { return x.indexOf(p) >= 0; }); };
    var h = "";
    var al = D.alunos.filter(function (a) { return bate(a[1]) || String(a[0]).indexOf(q) === 0; }).slice(0, 8);
    if (al.length) {
      h += '<div class="grupo">Alunos</div>' + al.map(function (a) {
        var f = emFaltaAluno(a[0]), casa = requisicoesDoAluno(a[0]).filter(function (r) { return !r[8]; }).length;
        return '<button type="button" data-ir-aluno="' + esc(a[0]) + '"><b>' + esc(a[1]) + '</b> · ' + esc(a[2]) + (a[3] ? ' · n.º ' + esc(a[3]) : '') +
          '<span class="sec' + (f ? ' falta' : '') + '">' + (/^\d+$/.test(a[0]) ? 'proc. ' + esc(a[0]) + ' · ' : '') +
          (f ? plural(f, "livro em falta", "livros em falta") : (casa ? plural(casa, "livro em casa", "livros em casa") : "sem livros requisitados")) + '</span></button>';
      }).join("");
    }
    var emp = D.requisicoes.filter(function (r) { return !r[8] && bate(titulo(r)); }).slice(0, 8), vistos = {};
    if (emp.length) {
      h += '<div class="grupo">Livros requisitados — quem os tem</div>' + emp.map(function (r) {
        var a = alunoPorId[r[2]], st = situacao(r);
        return '<button type="button" data-ir-aluno="' + esc(r[2]) + '"><b>' + esc(titulo(r)) + '</b><span class="sec' + (st.atraso ? ' falta' : '') + '">com ' +
          esc(a ? a.nome + " (" + a.turma + ")" : r[2]) + ' · ' + (st.atraso ? 'em falta há ' + plural(st.atraso, "dia", "dias") : 'entrega até ' + fmt(r[7] || r[5])) + '</span></button>';
      }).join("");
    }
    var cat = D.livros.filter(bate).slice(0, 8);
    if (cat.length) h += '<div class="grupo">Catálogo</div>' + cat.map(function (t) {
      var d = disponibilidade(t);
      return '<div class="item"><b>' + esc(t) + '</b><span class="sec' + (d.livres <= 0 ? ' falta' : '') + '">' + (d.autor ? esc(d.autor) + ' · ' : '') + textoDisp(d) + (d.registos ? ' · registo ' + esc(d.registos) : '') + '</span></div>';
    }).join("");
    res.innerHTML = h || '<div class="item">Nada encontrado.</div>'; res.hidden = false;
  }
  $("pesq").addEventListener("input", pesquisar);
  $("pesq").addEventListener("focus", pesquisar);
  $("pesq").addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { $("pesq").value = ""; fecharPesquisa(); }
    if (ev.key === "Enter") { var p = $("pesqRes").querySelector("[data-ir-aluno]"); if (p) p.click(); }
  });
  $("pesqRes").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-ir-aluno]"); if (!b) return;
    $("pesq").value = ""; fecharPesquisa(); $("pesq").blur(); abrirAluno(b.getAttribute("data-ir-aluno"));
  });
  document.addEventListener("click", function (ev) { if (!ev.target.closest("#pesqCaixa")) fecharPesquisa(); });

  carregar();
})();
</script>
</body>
</html>
